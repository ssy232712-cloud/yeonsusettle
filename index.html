<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대회 예산·정산 도우미</title>
<meta name="description" content="예산 짜기부터 쓴 돈 기록, 1인 반환금 계산, 정산표 PDF까지 한 번에. 입력한 내용은 내 기기에만 저장돼요.">
<meta property="og:title" content="대회 예산·정산 도우미">
<meta property="og:description" content="예산 짜기 → 쓴 돈 기록 → 정산 → 정산표 PDF. 입력한 내용은 내 기기에만 저장돼요.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style id="css">
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#18212d; --sub:#667385; --line:#e3e8ef; --soft:#f7f9fc;
  --blue:#2563eb; --blue-s:#e8f0ff; --orange:#ea6a12; --orange-s:#fff1e6; --green:#15803d; --green-s:#e7f6ec;
  --red:#d92d2d; --red-s:#fdecec; --yellow:#fff5c2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
.num,input.n{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .blue{color:var(--blue)} .orange{color:var(--orange)}
.muted{color:var(--sub);font-size:14px}
/* header */
header.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 0 var(--line)}
.hd{max-width:760px;margin:0 auto;padding:10px 14px 8px;display:flex;align-items:center;gap:8px}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:17px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12.5px;color:var(--sub);margin-top:1px}
.iconbtn{border:0;background:var(--soft);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--sub)}
.savebtn{border:0;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:14px;height:40px;padding:0 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.savebtn .dot{width:8px;height:8px;border-radius:50%;background:#6ee7a0}
.savebtn.need{background:var(--blue)}
.savebtn.need .dot{background:#ffd166}
.band{max-width:760px;margin:0 auto;padding:0 14px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.band .b{border-radius:12px;padding:7px 10px}
.band .b span{display:block;font-size:11.5px;font-weight:700;opacity:.8}
.band .b b{font-size:15.5px;font-weight:800;white-space:nowrap}
.band .b1{background:var(--blue-s);color:var(--blue)}
.band .b2{background:var(--orange-s);color:var(--orange)}
.band .b3{background:var(--green-s);color:var(--green)}
.band .b3.minus{background:var(--red-s);color:var(--red)}
/* bottom nav */
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bnav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bnav button{border:0;background:none;font:inherit;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#97a1af;cursor:pointer;font-size:11.5px;font-weight:700;position:relative}
nav.bnav button svg{width:24px;height:24px}
nav.bnav button.on{color:var(--blue)}
nav.bnav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
nav.bnav button i{font-style:normal;font-size:10px;position:absolute;top:5px;right:calc(50% - 22px);background:var(--ink);color:#fff;border-radius:9px;padding:0 5px;line-height:15px}
main{max-width:760px;margin:0 auto;padding:14px 14px 110px}
/* intro */
.intro{margin:4px 2px 14px}
.intro .stepno{display:inline-block;font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-s);border-radius:99px;padding:3px 10px}
.intro h2{font-size:22px;margin:8px 0 4px;font-weight:800;letter-spacing:-.3px}
.intro p{margin:0;color:var(--sub);font-size:14.5px;line-height:1.55}
/* cards */
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{font-size:16.5px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center;flex:none}
.card .desc{margin:0 0 12px;color:var(--sub);font-size:13.5px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--sub);font-weight:700;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{font:inherit;color:var(--ink);border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
input.n{text-align:right;font-weight:700}
input.big{font-size:26px;font-weight:800;padding:14px;text-align:right}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ora{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.full{width:100%;display:block;text-align:center}
.btn.big{padding:15px;font-size:17px;border-radius:14px}
.btn.dash{border-style:dashed;color:var(--sub);background:transparent;width:100%}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
button:disabled{opacity:.45;cursor:default}
.x{border:0;background:none;color:#a7b0bd;font-size:22px;line-height:1;padding:6px;cursor:pointer}
.x:hover{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap}
/* stepper */
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.prow input.lbl{flex:1;border-color:transparent;background:var(--soft);font-weight:700}
.stepper{display:flex;align-items:center;background:var(--soft);border-radius:12px;flex:none}
.stepper button{border:0;background:none;width:40px;height:42px;font-size:22px;font-weight:700;color:var(--blue);cursor:pointer}
.stepper input{width:52px;text-align:center;border:0;background:transparent;padding:8px 0;font-weight:800;font-size:17px}
.stepper input:focus{box-shadow:none}
/* list cards (budget/usage) */
.lc{background:#fff;border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.lc .hdr{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;user-select:none}
.lc .no{width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13.5px;color:var(--sub);flex:none}
.lc .mid{flex:1;min-width:0}
.lc .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .fx{font-size:13px;color:var(--sub);margin-top:2px}
.lc .amt{text-align:right;font-weight:800;white-space:nowrap}
.lc .amt small{display:block;font-size:12px;font-weight:600;color:var(--sub)}
.lc .chev{color:#b3bcc8;transition:.2s;flex:none}
.lc.open .chev{transform:rotate(180deg)}
.lc .body{display:none;padding:2px 14px 14px;border-top:1px solid var(--line)}
.lc.open .body{display:block}
.lc .body .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.bar{height:8px;border-radius:9px;background:#edf0f4;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:9px;transition:width .3s}
.bar i.over{background:var(--red)}
.erow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.erow .memo{grid-column:1/-1}
.erow input.amt{font-weight:800}
.erow.card input.amt{color:var(--blue)}
.pay{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;color:var(--sub);white-space:nowrap}
.pay.card{background:var(--blue-s);border-color:#bcd2fb;color:var(--blue)}
/* hero */
.hero{border-radius:20px;padding:20px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#16a34a,#0f7a37)}
.hero span{font-size:14px;font-weight:700;opacity:.9}
.hero b{display:block;font-size:36px;font-weight:800;margin:4px 0 6px;letter-spacing:-.5px}
.hero p{margin:0;font-size:14px;opacity:.92;line-height:1.5}
.hero.blue{background:linear-gradient(135deg,#2563eb,#1d4fc4)}
.hero.minus{background:linear-gradient(135deg,#d92d2d,#a61b1b)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-size:16px;white-space:nowrap}
.kv.tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:2px}
.kv.tot b{font-size:19px}
.drow{display:grid;grid-template-columns:1.4fr 1fr 70px auto;gap:6px;align-items:center;margin-bottom:8px}
.xrow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:6px;align-items:center;margin-bottom:8px}
.colh{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px}
.okbox,.warnbox{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px;font-weight:600}
.okbox{background:var(--green-s);color:#17663a}
.warnbox{background:#fff4e0;color:#8a5a00}
.badbox{background:var(--red-s);color:var(--red);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px;font-weight:700}
.yellow{background:var(--yellow)}
.legend{display:flex;gap:12px;font-size:13px;color:var(--sub);margin:10px 2px 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stepnav{display:flex;gap:8px;margin-top:18px}
.stepnav .btn{flex:1;padding:14px}
.stepnav .btn.pri{flex:2}
.empty{text-align:center;color:var(--sub);padding:14px 0;font-size:14px}
/* report */
.sheet{background:#fff;border-radius:18px;padding:20px;overflow-x:auto}
.sheet h3{font-size:22px;margin:0 0 14px;font-weight:800}
.sheet ul.info{list-style:none;padding:0;margin:0 0 18px;line-height:1.9;font-size:15px}
.sheet ul.info li::before{content:"• ";font-weight:800}
table.rep{border-collapse:collapse;font-size:13.5px;min-width:900px;width:100%}
table.rep th,table.rep td{border:1px solid #cfd6df;padding:6px 8px;white-space:nowrap}
table.rep th{background:#f3f6fa;font-weight:700;text-align:center}
table.rep td.r{text-align:right}
table.rep td.c{text-align:center}
table.rep td.sep,table.rep th.sep{border-top:0;border-bottom:0;background:#fff;width:12px;padding:0}
table.rep tr.tot td{font-weight:800;background:#fafbfd}
.repfoot{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;min-width:900px}
.repfoot .kv{padding:6px 0}
.repfoot .bank{background:var(--yellow);border-radius:10px;padding:12px 16px}
.repfoot .bank .kv{border-bottom-color:#e6d27a}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
/* toast / modal */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#18212d;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;font-weight:600}
.toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,35,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:19px}
.modal p{color:var(--sub);margin:0 0 14px;line-height:1.6;font-size:14px}
.modal .act{display:flex;gap:8px;justify-content:flex-end}
.modal .grid{display:grid;gap:8px}
@media (max-width:600px){
  .modal-bg.sheetbg{align-items:flex-end;padding:0}
  .modal-bg.sheetbg .modal{border-radius:22px 22px 0 0;max-width:none;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
.modal p.qlbl{font-size:14.5px;font-weight:800;margin:18px 0 8px;color:var(--ink)}
.modal p.qlbl:first-of-type{margin-top:6px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.pick button.on{border-color:var(--orange);background:var(--orange-s);color:var(--orange)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:800;cursor:pointer;color:var(--sub)}
.seg button.on{border-color:var(--blue);background:var(--blue-s);color:var(--blue)}
.seg button.on.r{border-color:var(--ink);background:var(--soft);color:var(--ink)}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick button{border:0;background:var(--soft);border-radius:99px;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub)}
textarea.copy{width:100%;height:220px;font:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:12px;padding:10px}
.banner{background:var(--blue-s);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:180px}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="state">null</script>
<script id="app">
(function(){
"use strict";
var CSS = document.getElementById('css').textContent;
var APP = document.getElementById('app').textContent;
var LS_KEY = 'settle-app-draft-v1';

/* ---------- 예시 데이터 (2026 경주화랑대기) ---------- */
function sample(){
  function E(a,c){return {amt:a,card:!!c,memo:''};}
  return {
    rev:0, demo:true,
    info:{title:'2026년 경주화랑대기',place:'경주시민운동장, 축구공원, 알천구장, 에어돔',start:'2026-08-27',end:'2026-09-03',
      grades:[{label:'6학년',count:12},{label:'5학년',count:8},{label:'4학년',count:6},{label:'3학년',count:1}],coaches:5},
    items:[
      {name:'선수단 식음료비 (물,음료,얼음)',unit:4000,people:31,days:8,manual:null,entries:[E(100000,1),E(13800,1),E(125000,1),E(10000),E(18700),E(13100),E(237530)]},
      {name:'선수단 간식비',unit:4000,people:31,days:8,manual:null,entries:[E(112000,1),E(422360),E(77220),E(32400)]},
      {name:'선수단 세탁비 (1일2회 예상)',unit:35000,people:1,days:7,manual:null,entries:[E(50000),E(50000),E(25000),E(15000),E(13000),E(20000)]},
      {name:'선수단 약품비 (비상약 구입 외)',unit:1000,people:31,days:8,manual:null,entries:[E(33000,1),E(26220)]},
      {name:'선수단 특식비 외 추가식사비',unit:40000,people:31,days:1,manual:null,entries:[E(64500,1),E(188000,1),E(38280,1),E(39000,1),E(49000,1),E(156000,1),E(84000)]},
      {name:'선수단 사우나',unit:10000,people:31,days:1,manual:null,entries:[E(216000,1)]},
      {name:'선수단 예비비 및 활동경비',unit:500000,people:1,days:1,manual:null,entries:[E(500000,1)]},
      {name:'유류비 및 기타비품',unit:1000,people:31,days:8,manual:null,entries:[E(90000,1),E(202000,1)]}
    ],
    transfer:{label:'금강 잔여금액 이관 (반환분 39,510 제외)',amount:987800},
    share:145000,
    deposits:[{label:'기본 분담금',amount:145000,count:25},{label:'추가 분담 (145,000+39,510)',amount:184510,count:2}],
    refundUnit:1,
    bank:{label:'금강정산 후 8/17 모임통장 잔액 (이관금액 포함)',start:4374694,endLabel:'9/9 모임통장 최종 잔액',actual:3288851,
      extras:[{label:'화랑대기 별도 공용통장 사용금액',amount:-102760},{label:'체크카드 캐시백 / 이자',amount:4693}]},
    note:'※ 2026 연수구청 모임통장에서 확인하실 수 있습니다.'
  };
}
function blank(){
  return {rev:0,info:{title:'',place:'',start:'',end:'',grades:[{label:'선수',count:0}],coaches:0},
    items:[{name:'선수단 식음료비',unit:0,people:0,days:1,manual:null,entries:[]},{name:'선수단 간식비',unit:0,people:0,days:1,manual:null,entries:[]},{name:'예비비',unit:0,people:1,days:1,manual:null,entries:[]}],
    transfer:{label:'이전 대회 잔여금 이관',amount:0},share:0,deposits:[{label:'기본 분담금',amount:0,count:0}],refundUnit:1,
    bank:{label:'시작 통장 잔액',start:0,endLabel:'최종 통장 잔액',extras:[]},note:''};
}

/* ---------- state ---------- */
var published = null;
try{ published = JSON.parse(document.getElementById('state').textContent); }catch(e){}
var LS_SAVED='settle-app-saved-v1';
if(!published){ try{ var sv=JSON.parse(localStorage.getItem(LS_SAVED)||'null'); if(sv&&sv.info&&sv.items) published=sv; }catch(e){} }
var S = published ? clone(published) : sample();
var dirty = false, restoredDraft = false;
try{
  var d = JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(d && d.state && d.baseRev === (published?published.rev:-1) && JSON.stringify(d.state)!==JSON.stringify(S)){
    S = d.state; dirty = true; restoredDraft = true;
  }
}catch(e){}
var tab = (location.hash||'').replace('#','') || 'info';
var TABS=[['info','기본정보'],['budget','예산'],['usage','사용내역'],['settle','정산'],['report','정산표']];
if(!TABS.some(function(t){return t[0]===tab;})) tab='info';
var artifactApi=null, downloadsApi=null;

function clone(o){return JSON.parse(JSON.stringify(o));}
function num(v){ if(v===null||v===undefined||v==='')return 0; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; }
function fmt(n){ n=Math.round(n*10)/10; var neg=n<0; n=Math.abs(n); var p=String(n).split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return (neg?'-':'')+p.join('.'); }
function won(n){return fmt(n)+'원';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function letter(i){var s='';i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

/* ---------- calc ---------- */
function calc(){
  var c={};
  c.players=S.info.grades.reduce(function(a,g){return a+num(g.count);},0);
  c.total=c.players+num(S.info.coaches);
  c.items=S.items.map(function(it){
    var auto=num(it.unit)*num(it.people)*num(it.days);
    var budget=(it.manual===null||it.manual===''||it.manual===undefined)?auto:num(it.manual);
    var used=it.entries.reduce(function(a,e){return a+num(e.amt);},0);
    var card=it.entries.reduce(function(a,e){return a+(e.card?num(e.amt):0);},0);
    return {auto:auto,budget:budget,used:used,card:card,diff:budget-used};
  });
  c.itemsBudget=c.items.reduce(function(a,x){return a+x.budget;},0);
  c.transfer=num(S.transfer.amount);
  c.budget=c.itemsBudget-c.transfer;
  c.used=c.items.reduce(function(a,x){return a+x.used;},0);
  c.cardUsed=c.items.reduce(function(a,x){return a+x.card;},0);
  c.perCalc=c.players?c.budget/c.players:0;
  c.perSuggest=Math.ceil(c.perCalc/5000)*5000;
  c.deposit=S.deposits.reduce(function(a,d){return a+num(d.amount)*num(d.count);},0);
  c.depCount=S.deposits.reduce(function(a,d){return a+num(d.count);},0);
  c.avail=c.deposit+c.transfer;
  c.remain=c.avail-c.used;
  c.perRefund=c.players?c.remain/c.players:0;
  var u=num(S.refundUnit)||1;
  c.refundEach=c.perRefund>=0?Math.floor(c.perRefund/u)*u:0;
  c.refundTotal=c.refundEach*c.players;
  c.leftover=c.remain-c.refundTotal;
  c.extras=S.bank.extras.reduce(function(a,x){return a+num(x.amount);},0);
  c.bankEnd=num(S.bank.start)+c.deposit-c.used+c.extras-c.refundTotal;
  c.entryCount=S.items.reduce(function(a,it){return a+it.entries.length;},0);
  c.maxEntries=S.items.reduce(function(a,it){return Math.max(a,it.entries.length);},0);
  var nd=period();
  c.period=nd;
  return c;
}
function period(){
  var a=S.info.start,b=S.info.end; if(!a||!b) return '';
  var d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00'); var n=Math.round((d2-d1)/864e5);
  if(!(n>=0)) return '';
  function k(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일';}
  return d1.getFullYear()+'년 '+k(d1)+' ~ '+k(d2)+' ('+n+'박'+(n+1)+'일)';
}

  var c=calc(), n=Math.max(c.maxEntries,1);
  var g=S.info.grades.filter(function(x){return num(x.count);}).map(function(x){return esc(x.label)+' '+num(x.count)+'명';}).join(', ');
  var th='<tr><th>순번</th><th>내용</th><th>단가</th><th>인원</th><th>일수</th><th>금액</th><th>실제사용금액</th><th class="sep"></th>';
  for(var k=0;k<n;k++) th+='<th>'+letter(k)+'</th>'; th+='</tr>';

  body+='<tr><td class="c">'+(S.items.length+1)+'</td><td>'+esc(S.transfer.label)+'</td><td></td><td></td><td></td><td class="r">-'+fmt(c.transfer)+'</td><td class="r">-</td><td class="sep"></td>'+'<td></td>'.repeat(n)+'</tr>';
  body+='<tr class="tot"><td colspan="5" class="c">합 계</td><td class="r">'+fmt(c.budget)+'</td><td class="r">'+fmt(c.used)+'</td><td class="sep"></td>'+colSum+'</tr>';
  var bank=S.bank.extras.map(function(x){return '<div class="kv"><span>'+esc(x.label)+'</span><b class="num '+(num(x.amount)<0?'neg':'')+'">'+paren(num(x.amount))+'</b></div>';}).join('');
  var depTxt=S.deposits.filter(function(d){return num(d.count);}).map(function(d){return fmt(num(d.amount))+'원×'+num(d.count)+'명';}).join(' + ');
  return '<div class="sheet"><h3>'+esc(S.info.title)+' 정산 안내</h3><ul class="info">'+
  '<li>장 소 : '+esc(S.info.place)+'</li><li>기 간 : '+esc(c.period)+'</li>'+
  '<li>참가 인원 : <b class="neg">선수 '+c.players+'명</b>'+(g?' ('+g+')':'')+' / 지도진 '+num(S.info.coaches)+'명 / <b class="neg">총 '+c.total+'명</b></li></ul>'+
  '<p style="margin:0 0 6px;font-weight:800">• 주요 예산 항목 <span class="legend" style="font-weight:400">— 사용내역 검정: 영수증 증빙 / <span class="blue">파랑: 체크카드 및 이체 (모임통장에서 확인)</span></span></p>'+
  '<table class="rep">'+th+body+'</table>'+
  '<div class="repfoot"><div>'+
  kv('총 예산',won(c.budget))+kv('선수 1인 기준 분담금',won(num(S.share)))+kv('입금 금액 ('+c.depCount+'명)',won(c.deposit),depTxt)+
  kv('이관금액 반영 총 예산',won(c.avail))+kv('총 사용금액',won(c.used))+kv('잔여금액',won(c.remain))+
  '<div class="kv"><span class="pos"><b>선수 1인 기준 반환금</b></span><b class="num pos">'+fmt(c.refundEach)+' 원</b></div>'+
  '<p class="muted pos">잔여금액 ÷ '+c.players+'명 = '+fmt(c.perRefund)+'원 (실제 반환 '+fmt(c.refundEach)+'원)</p></div>'+

  '<div class="kv" style="border-top:3px double #b9a640"><span><b>'+esc(S.bank.endLabel)+'</b></span><b class="num">'+fmt(c.bankEnd)+'</b></div>'+

function paren(n){return n<0?'('+fmt(-n)+')':fmt(n);}

/* ---------- live numbers ---------- */
function updateCalc(){
  var c=calc();
  var leftMode=c.deposit>0;
  var map={title:S.info.title||'새 대회',period:c.period||'날짜를 입력하세요',periodPill:c.period?'📅 '+c.period:'📅 날짜를 고르면 기간이 표시돼요',
    players:c.players+'명',coaches:num(S.info.coaches)+'명',total:c.total+'명',
    itemsBudget:won(c.itemsBudget),transfer:won(c.transfer),budget:won(c.budget),
    perCalc:won(Math.round(c.perCalc)),perSuggest:won(c.perSuggest),used:won(c.used),usedNeg:'−'+won(c.used),
    cardUsed:won(c.cardUsed),rcptUsed:won(c.used-c.cardUsed),deposit:won(c.deposit),depCount:c.depCount,avail:won(c.avail),
    remain:won(c.remain),perRefund:fmt(c.perRefund)+'원',refundEach:won(c.refundEach),refundTotal:won(c.refundTotal),
    refundNeg:'−'+won(c.refundTotal),leftover:won(c.leftover),bankEnd:won(c.bankEnd),
    leftLabel:leftMode?'남은 돈':'남은 예산',leftAmt:won(leftMode?c.remain:c.budget-c.used)};
  c.items.forEach(function(x,i){
    var it=S.items[i];
    map['iname'+i]=it.name||'(이름 없음)';
    map['fx'+i]=(it.manual===null||it.manual===''||it.manual===undefined)?fmt(num(it.unit))+'원 × '+fmt(num(it.people))+'명 × '+fmt(num(it.days))+'일':'금액 직접 입력';
    map['used'+i]=won(x.used); map['bud'+i]=won(x.budget);
    map['diff'+i]=x.diff>=0?won(x.diff)+' 남음':won(-x.diff)+' 초과!';
  });
  root.querySelectorAll('[data-c]').forEach(function(el){
    var k=el.getAttribute('data-c');
    if(k==='depCheck'){
      el.innerHTML = c.depCount===c.players ? '<div class="okbox">✓ 입금 인원 '+c.depCount+'명 = 선수 '+c.players+'명</div>'
        : '<div class="warnbox">입금 인원('+c.depCount+'명)과 선수 수('+c.players+'명)가 달라요.</div>';
      return;
    }
    if(k==='bankCheck'){
      var a=S.bank.actual;
      if(a===null||a===undefined||a===''){ el.innerHTML=''; return; }
      var d=num(a)-c.bankEnd;
      el.innerHTML = d===0 ? '<div class="okbox" style="margin:-4px 0 10px">✓ 실제 잔액과 딱 맞아요. 정산 끝!</div>'
        : '<div class="badbox" style="margin:-4px 0 10px">실제 잔액이 '+won(Math.abs(d))+' '+(d>0?'더 많아요':'더 적어요')+'. 빠진 입출금이 없는지 확인해 보세요.</div>';
      return;
    }
    if(k in map) el.textContent=map[k];
    if(/^diff/.test(k)) el.className='fx'+(c.items[+k.slice(4)].diff<0?' neg':'');
  });
  var b3=root.querySelector('#b3'); if(b3) b3.classList.toggle('minus',(leftMode?c.remain:c.budget-c.used)<0);
  var hero=root.querySelector('#hero'); if(hero) hero.classList.toggle('minus',c.remain<0);
  root.querySelectorAll('[data-bar]').forEach(function(el){
    var x=c.items[+el.getAttribute('data-bar')]; var p=x.budget>0?Math.min(100,x.used/x.budget*100):(x.used>0?100:0);
    el.style.width=p+'%'; el.className=x.used>x.budget?'over':'';
  });
  root.querySelectorAll('[data-ph]').forEach(function(el){
    var i=+el.getAttribute('data-ph').slice(4); el.placeholder=fmt(c.items[i].auto);
  });
}
function updateStatus(){
  var el=document.getElementById('st'), b=document.getElementById('savebtn'); if(!el)return;
  el.textContent = dirty ? '저장하기' : '저장됨';
  b.classList.toggle('need',dirty);
  b.title = dirty ? '저장 안 된 변경이 있어요' : (artifactApi?'모든 변경이 저장됐어요':'이 기기(브라우저)에 저장됐어요');
}

/* ---------- quick add (쓴 돈 기록) ---------- */
function quickAdd(pre){
  var sel=(pre===undefined||isNaN(pre))?(S.items.length===1?0:-1):pre, card=true;
  var m=modal('<h3>쓴 돈 기록하기</h3>'+
    '<p class="qlbl">① 어디에 썼나요?</p><div class="pick">'+S.items.map(function(it,i){return '<button data-q="'+i+'" class="'+(i===sel?'on':'')+'">'+esc(it.name||('항목 '+(i+1)))+'</button>';}).join('')+'</div>'+
    '<p class="qlbl">② 얼마인가요?</p><input class="big n" inputmode="numeric" placeholder="0" id="qamt">'+
    '<div class="quick">'+[1000,5000,10000,50000].map(function(v){return '<button data-plus="'+v+'">+'+fmt(v)+'</button>';}).join('')+'<button data-plus="0">지우기</button></div>'+
    '<p class="qlbl">③ 어떻게 냈나요?</p><div class="seg"><button data-pay="1" class="on">카드·이체</button><button data-pay="0" class="r">영수증(현금)</button></div>'+
    '<p class="qlbl">④ 메모 <span class="muted">(선택)</span></p><input id="qmemo" placeholder="예: 8/28 편의점 얼음">'+
    '<div id="qerr"></div><div class="two" style="margin-top:16px"><button class="btn big" data-more>기록 + 하나 더</button><button class="btn ora big" data-ok>기록하기</button></div>'+
    '<button class="btn full" data-close style="margin-top:8px;border:0;color:var(--sub)">닫기</button>','sheetbg');
  var amt=m.querySelector('#qamt'), memo=m.querySelector('#qmemo'), err=m.querySelector('#qerr');
  amt.addEventListener('input',function(){ var v=num(amt.value); amt.value=v?fmt(v):''; });
  function commit(keep){
    var v=num(amt.value);
    if(sel<0){ err.innerHTML='<div class="badbox">① 어디에 썼는지 골라 주세요.</div>'; return; }
    if(!(v>0)){ err.innerHTML='<div class="badbox">② 금액을 넣어 주세요.</div>'; amt.focus(); return; }
    S.items[sel].entries.push({amt:v,card:card,memo:memo.value.trim()});
    touch(); render(); toast((S.items[sel].name||'항목')+'에 '+won(v)+' 기록했어요');
    if(keep){ amt.value=''; memo.value=''; err.innerHTML=''; amt.focus(); } else m.remove();
  }
  m.addEventListener('click',function(e){
    var q=e.target.closest('[data-q]'); if(q){ sel=+q.getAttribute('data-q'); m.querySelectorAll('[data-q]').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-q')===sel);}); err.innerHTML=''; amt.focus(); return; }
    var p=e.target.closest('[data-pay]'); if(p){ card=p.getAttribute('data-pay')==='1'; m.querySelectorAll('[data-pay]').forEach(function(b){b.classList.toggle('on',(b.getAttribute('data-pay')==='1')===card);}); return; }
    var pl=e.target.closest('[data-plus]'); if(pl){ var d=+pl.getAttribute('data-plus'); amt.value=d?fmt(num(amt.value)+d):''; return; }
    if(e.target.closest('[data-ok]')) commit(false);
    if(e.target.closest('[data-more]')) commit(true);
  });
  setTimeout(function(){ if(sel>=0) amt.focus(); },50);
}

/* ---------- events ---------- */
var draftT=null;
function touch(){
  dirty=true; updateStatus();
  clearTimeout(draftT); draftT=setTimeout(function(){
    try{localStorage.setItem(LS_KEY,JSON.stringify({baseRev:published?published.rev:-1,state:S}));}catch(e){}
  },400);
}
root.addEventListener('input',function(e){
  var t=e.target, p=t.getAttribute('data-p'); if(!p)return;
  var v=t.value;
  if(t.getAttribute('data-n')){ v=(t.getAttribute('data-null')&&v.trim()==='')?null:num(v); }
  setP(p,v); touch(); updateCalc();
});
root.addEventListener('change',function(e){
  var t=e.target; if(t.getAttribute('data-n') && t.tagName==='INPUT' && !t.closest('.stepper')){ var v=getP(t.getAttribute('data-p')); t.value=(v===null||v==='')?'':fmt(v); }
  if(t.tagName==='SELECT'){ setP(t.getAttribute('data-p'),num(t.value)); touch(); updateCalc(); }
});
root.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b)return;
  var a=b.getAttribute('data-a'), i=+b.getAttribute('data-i'), l=b.getAttribute('data-l');
  var c=calc();
  switch(a){
    case 'tab': tab=b.getAttribute('data-t'); try{history.replaceState(null,'','#'+tab);}catch(_){location.hash=tab;} render(); window.scrollTo(0,0); return;
    case 'toggle': var k=b.getAttribute('data-k'); open[k][i]=!open[k][i]; b.parentElement.classList.toggle('open',open[k][i]); return;
    case 'inc': var p=b.getAttribute('data-p'); setP(p,Math.max(0,num(getP(p))+(+b.getAttribute('data-d')))); var el=b.parentElement.querySelector('input'); if(el) el.value=num(getP(p)); touch(); updateCalc(); return;
    case 'quick': quickAdd(b.hasAttribute('data-i')?i:undefined); return;
    case 'add':
      var arr=getP(l);
      if(l==='info.grades') arr.push({label:'',count:0});
      else if(l==='deposits') arr.push({label:'',amount:num(S.share),count:0});
      else if(l==='bank.extras') arr.push({label:'',amount:0});
      break;
    case 'del': getP(l).splice(i,1); if(l==='items'){open.budget={};open.usage={};} break;
    case 'addItem': S.items.push({name:'',unit:0,people:c.total||0,days:1,manual:null,entries:[]}); open.budget[S.items.length-1]=true; break;
    case 'card': var en=S.items[i].entries[+b.getAttribute('data-j')]; en.card=!en.card; break;
    case 'applySuggest': S.share=c.perSuggest; break;
    case 'shareToDeposit': if(S.deposits.length) S.deposits[0].amount=num(S.share); else S.deposits.push({label:'기본 분담금',amount:num(S.share),count:c.players}); toast('첫 번째 입금 줄에 넣었어요'); break;
    case 'save': save(); return;
    case 'menu': menu(); return;
    case 'notice': showCopy('공지 문구',noticeText()); return;
    case 'csv': csv(); return;
    case 'newEvent': confirmBox('새 대회를 시작할까요?','예시 데이터를 지우고 빈 화면에서 시작해요.',function(){ S=blank(); touch(); tab='info'; render(); window.scrollTo(0,0); }); return;
    case 'pdf': makePDF(false); return;
    case 'pdfShare': makePDF(true); return;
    case 'gsheet': gsheetModal(); return;
    case 'discardDraft': S=published?clone(published):sample(); dirty=false; restoredDraft=false; try{localStorage.removeItem(LS_KEY);}catch(_){ } render(); return;
    default: return;
  }
  touch(); render();
});

/* ---------- save (artifact publish) ---------- */
function buildDoc(state){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var head=document.head.innerHTML.replace(/<style id="css">[\s\S]*?<\/style>/,'');
  return '<!DOCTYPE html>\n<html lang="ko">\n<head>'+head+'<style id="css">'+CSS+'</style>\n</head>\n<body>\n<div id="root"></div>\n'+
    '<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+APP+'<\/script>\n</body>\n</html>';
}
function save(){
  if(!artifactApi){
    var st0=clone(S); st0.rev=(published?num(published.rev):0)+1;
    try{ localStorage.setItem(LS_SAVED,JSON.stringify(st0)); localStorage.removeItem(LS_KEY); }
    catch(e){ toast('이 브라우저에는 저장할 수 없어요. 백업(JSON)을 받아 두세요.'); return; }
    published=st0; S.rev=st0.rev; dirty=false; restoredDraft=false; updateStatus();
    toast('이 기기(브라우저)에 저장했어요. 다른 기기와 나누려면 구글시트로 내보내세요'); return;
  }
  var st=clone(S); st.rev=(published?num(published.rev):0)+1;
  toast('저장 중…');
  Promise.resolve(artifactApi.publish(buildDoc(st))).then(function(){
    try{localStorage.removeItem(LS_KEY);}catch(_){}
    published=st; S.rev=st.rev; dirty=false; restoredDraft=false; updateStatus(); toast('저장했어요');
  }).catch(function(err){
    var code=(err&&(err.code||err.name))||'';
    if(/not_granted|not_writer/.test(code)) toast('보기 전용이라 저장할 수 없어요');
    else if(/conflict/.test(code)) toast('다른 곳에서 먼저 저장했어요. 새 버전을 불러옵니다');
    else toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요');
  });
}

/* ---------- menu / modals ---------- */
function modal(html,cls){
  var bg=document.createElement('div'); bg.className='modal-bg'+(cls?' '+cls:''); bg.innerHTML='<div class="modal">'+html+'</div>';
  bg.addEventListener('click',function(e){ if(e.target===bg||e.target.closest('[data-close]')) bg.remove(); });
  document.body.appendChild(bg); return bg;
}
function menu(){
  var m=modal('<h3>더보기</h3><p>백업·불러오기와 새 대회 만들기</p><div class="grid">'+
    '<button class="btn" data-m="shareapp">이 앱 링크 공유하기</button>'+
    '<button class="btn pri" data-m="gsheet">구글시트 내보내기·불러오기</button><button class="btn" data-m="notice">공지 문구 복사</button>'+
    '<button class="btn" data-m="backup">백업 파일(JSON) 받기</button>'+
    '<button class="btn" data-m="copyjson">백업 내용 복사</button>'+
    '<label class="btn" style="text-align:center;cursor:pointer">백업 파일 불러오기<input type="file" accept=".json,application/json" hidden></label>'+
    '<button class="btn" data-m="paste">붙여넣어 불러오기</button>'+
    '<button class="btn" data-m="sample">예시(경주화랑대기) 불러오기</button>'+
    '<button class="btn" data-m="new" style="color:var(--red)">새 대회 시작 (모두 비우기)</button>'+
    '<button class="btn ghost" data-close>닫기</button></div>');
  m.addEventListener('click',function(e){
    var b=e.target.closest('[data-m]'); if(!b)return; var k=b.getAttribute('data-m');
    if(k==='backup'){ download((S.info.title||'정산')+'_백업.json',JSON.stringify(S,null,1),'application/json'); }
    if(k==='gsheet'){ m.remove(); gsheetModal(); return; }
    if(k==='shareapp'){ m.remove(); shareApp(); return; }
    if(k==='notice'){ m.remove(); showCopy('공지 문구',noticeText()); return; }

function normDate(s){ var m=String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if(!m)return ''; return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2); }

function parseCSVText(t){
  var rows=[],row=[],cur='',q=false; t=String(t).replace(/^\ufeff/,'');
  for(var i=0;i<t.length;i++){ var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; row.push(cur);rows.push(row);row=[];cur=''; }
    else cur+=ch; }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.map(function(r){return r.map(function(x){return x.trim();});});
}
function mdRows(text){
  var rows=[];

    line=line.trim(); if(line.charAt(0)!=='|')return;
    var cells=line.split(/(?<!\\)\|/).slice(1,-1).map(function(x){return x.trim().replace(/\\([\\`*_{}\[\]()#+\-.!|"<>~])/g,'$1');});
    if(cells.every(function(x){return /^:?-*:?$/.test(x);}))return;

  });
  return rows;
}
function parseRows(rows){

  rows.forEach(function(r){

            '<br><small class="muted">수정 '+esc(String(f.modifiedTime||'').replace('T',' ').slice(0,16))+' (UTC)</small></button>';
        }).join('');

    }

      mcpApi.callTool(GD,'read_file_content',{fileId:id},{cache:false}).then(function(res){

        var st; try{ st=parseSheet(text); }catch(_){ say('이 시트에서 정산 데이터를 찾지 못했어요. 앱에서 내보낸 형식(구분 칸)을 유지해 주세요.'); done(); return; }
        done(); m.remove();
        var used=st.items.reduce(function(a,it){return a+it.entries.reduce(function(x,e){return x+num(e.amt);},0);},0);

/* ---------- PDF (외부 라이브러리 없이 직접 그리기) ---------- */
function drawReport(){
  var c=calc(), n=Math.max(c.maxEntries,1), W=1123, M=36, FONT='"Noto Sans KR",system-ui,sans-serif';
  var colW=[38,0,74,44,44,92,96,10], base=colW.reduce(function(a,b){return a+b;},0), ew=Math.max(64,Math.min(84,(W-2*M-base-220)/n)), nameW=Math.max(200,W-2*M-base-ew*n);
  colW[1]=nameW; var tableW=base+nameW+ew*n, sc=Math.min(1,(W-2*M)/tableW);
  var rows=S.items.length+3, rh=27;
  var H=Math.ceil(170+ (rows*rh)*sc + 300 + (S.bank.extras.length*26) + 40);
  var cv=document.createElement('canvas'), k=2; cv.width=W*k; cv.height=H*k;
  var g=cv.getContext('2d'); g.scale(k,k); g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.textBaseline='middle';
  function f(sz,b){g.font=(b?'700 ':'400 ')+sz+'px '+FONT;}
  function t(x,y,s,col,al){g.fillStyle=col||'#18212d';g.textAlign=al||'left';g.fillText(s,x,y);}
  function fit(s,w){s=String(s);if(g.measureText(s).width<=w)return s;while(s.length&&g.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…';}
  function rich(x,y,parts){parts.forEach(function(p){f(15,p[2]);g.fillStyle=p[1]||'#18212d';g.textAlign='left';g.fillText(p[0],x,y);x+=g.measureText(p[0]).width;});}
  var RED='#d92d2d',BLUE='#2563eb',GREEN='#15803d';
  var y=M+14; f(26,1); t(M,y,(S.info.title||'')+' 정산 안내');
  y+=40; rich(M,y,[['• 장 소 : '+(S.info.place||''),'',0]]);
  y+=26; rich(M,y,[['• 기 간 : '+(c.period||''),'',0]]);
  var gtxt=S.info.grades.filter(function(x){return num(x.count);}).map(function(x){return x.label+' '+num(x.count)+'명';}).join(', ');
  y+=26; rich(M,y,[['• 참가 인원 : ','',0],['선수 '+c.players+'명',RED,1],[(gtxt?' ('+gtxt+')':'')+' / 지도진 '+num(S.info.coaches)+'명 / ','',0],['총 '+c.total+'명',RED,1]]);
  y+=34; f(15,1); t(M,y,'• 주요 예산 항목'); f(12.5); t(M+130,y,'사용내역  검정: 영수증 증빙  /','#667385'); t(M+130+g.measureText('사용내역  검정: 영수증 증빙  /').width+4,y,'파랑: 체크카드·이체 (모임통장에서 확인)',BLUE);
  y+=16;
  // table
  g.save(); g.translate(M,y); g.scale(sc,sc);
  var xs=[0]; colW.forEach(function(w){xs.push(xs[xs.length-1]+w);}); for(var e=0;e<n;e++) xs.push(xs[xs.length-1]+ew);
  var heads=['순번','내용','단가','인원','일수','금액','실제사용금액',''].concat(Array.from({length:n},function(_,i){return letter(i);}));
  var data=S.items.map(function(it,i){var x=c.items[i];var r=[[String(i+1),'c'],[it.name,'l'],[fmt(num(it.unit)),'r'],[fmt(num(it.people)),'c'],[fmt(num(it.days)),'c'],[fmt(x.budget),'r'],[fmt(x.used),'r',x.used>x.budget?RED:null],['','']];
    for(var e=0;e<n;e++){var en=it.entries[e];r.push([en&&num(en.amt)?fmt(num(en.amt)):'','r',en&&en.card?BLUE:null]);} return r;});
  var tr=[[String(S.items.length+1),'c'],[S.transfer.label,'l'],['',''],['',''],['',''],['-'+fmt(c.transfer),'r'],['-','r'],['','']]; for(var e2=0;e2<n;e2++)tr.push(['','']); data.push(tr);
  var tot=[['합 계','c'],['',''],['',''],['',''],['',''],[fmt(c.budget),'r'],[fmt(c.used),'r'],['','']];
  for(var e3=0;e3<n;e3++){var sm=S.items.reduce(function(a,it){return a+(it.entries[e3]?num(it.entries[e3].amt):0);},0);tot.push([sm?fmt(sm):'-','r']);}
  var all=[heads.map(function(h){return [h,'c'];})].concat(data,[tot]);
  all.forEach(function(r,ri){
    var yy=ri*rh, head=ri===0, last=ri===all.length-1;
    if(head||last){g.fillStyle=head?'#f0f3f8':'#fafbfd';g.fillRect(0,yy,xs[7],rh);g.fillRect(xs[8],yy,xs[xs.length-1]-xs[8],rh);}
    r.forEach(function(cell,ci){
      if(ci===7)return; var x0=xs[ci],x1=xs[ci+1];
      if(last&&ci===0){x1=xs[5];} if(last&&ci>0&&ci<5)return;
      g.strokeStyle='#c9d1dc';g.lineWidth=1;g.strokeRect(x0+.5,yy+.5,x1-x0,rh);
      var w=x1-x0-10, fs=12.5; f(fs,head||last); if(cell[1]!=='l'){ while(fs>8.5&&g.measureText(cell[0]).width>w){fs-=.5;f(fs,head||last);} } var s=fit(cell[0],w);
      var tx=cell[1]==='r'?x1-6:cell[1]==='c'?(x0+x1)/2:x0+6;
      t(tx,yy+rh/2+1,s,cell[2]||null,cell[1]==='r'?'right':cell[1]==='c'?'center':'left');
    });
  });
  g.restore();
  y+=all.length*rh*sc+28;
  // footer left
  var LX=M, LW=470, RX=W-M-430, RW=430, y0=y;
  function kv(x,yy,w,a,b,col,bold,sz){f(sz||15,1);t(x,yy,a,col);f(sz||15,bold!==false);t(x+w,yy,b,col,'right');}
  var dep=S.deposits.filter(function(d){return num(d.count);}).map(function(d){return fmt(num(d.amount))+'원×'+num(d.count)+'명';}).join(' + ');
  [['총 예산',won(c.budget)],['선수 1인 기준 분담금',won(num(S.share))],['입금 금액 ('+c.depCount+'명)',won(c.deposit)],['이관금액 반영 총 예산',won(c.avail)],['총 사용금액',won(c.used)],['잔여금액',won(c.remain)]].forEach(function(r,i){
    kv(LX,y+i*30,LW,'• '+r[0]+' :',r[1]);
    g.strokeStyle='#18212d';g.beginPath();g.moveTo(LX+LW-g.measureText(r[1]).width,y+i*30+11);g.lineTo(LX+LW,y+i*30+11);g.stroke();
  });
  var yy=y+6*30; kv(LX,yy,LW,'• 선수 1인 기준 반환금 :',fmt(c.refundEach)+' 원',GREEN,true,16);
  f(12.5); t(LX,yy+24,'잔여금액 ÷ '+c.players+'명 = '+fmt(c.perRefund)+'원 (실제 반환 '+fmt(c.refundEach)+'원)',GREEN);
  if(dep){f(12);t(LX,yy+44,fit('입금 내역: '+dep,LW),'#667385');}
  // bank box
  var lines=[[S.bank.label,fmt(num(S.bank.start))],['입금 금액',fmt(c.deposit)],['사용 금액','('+fmt(c.used)+')',RED]];
  S.bank.extras.forEach(function(x){var v=num(x.amount);lines.push([x.label,v<0?'('+fmt(-v)+')':fmt(v),v<0?RED:null]);});
  lines.push(['잔여금액 반환 ('+fmt(c.refundEach)+'×'+c.players+'명)','('+fmt(c.refundTotal)+')',RED]);
  var bh=lines.length*26+60+(S.note?26:0);
  g.fillStyle='#fff5c2'; g.beginPath(); if(g.roundRect)g.roundRect(RX,y0-16,RW,bh,10); else g.rect(RX,y0-16,RW,bh); g.fill();
  lines.forEach(function(l,i){f(13.5);t(RX+16,y0+4+i*26,fit(l[0],RW-150),'#18212d');f(13.5,1);t(RX+RW-16,y0+4+i*26,l[1],l[2],'right');});
  var ly=y0+4+lines.length*26-8; g.strokeStyle='#b9a640'; g.beginPath(); g.moveTo(RX+12,ly);g.lineTo(RX+RW-12,ly);g.moveTo(RX+12,ly+3);g.lineTo(RX+RW-12,ly+3);g.stroke();
  f(15,1); t(RX+16,ly+20,S.bank.endLabel||'최종 잔액'); t(RX+RW-16,ly+20,fmt(c.bankEnd),null,'right');
  if(S.note){f(12);t(RX+16,ly+46,fit(S.note,RW-32),'#667385');}
  var used=Math.max(yy+64,y0-16+bh+20); return {cv:cv,W:W,H:Math.min(H,Math.ceil(used)),k:k};
}
function b64bytes(b64){var s=atob(b64),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function buildPDF(pages){ // pages: [{jpg:Uint8Array,w,h}] → A4 landscape
  var enc=new TextEncoder(), parts=[], off=0, xref=[];
  function put(x){var b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length;}
  function obj(id,body){xref[id]=off;put(id+' 0 obj\n');body();put('\nendobj\n');}
  var PW=841.89,PH=595.28,m=22,np=pages.length,kids=[];
  for(var i=0;i<np;i++)kids.push((3+i*3)+' 0 R');
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,function(){put('<< /Type /Catalog /Pages 2 0 R >>');});
  obj(2,function(){put('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+np+' >>');});
  pages.forEach(function(pg,i){
    var pid=3+i*3,cid=pid+1,iid=pid+2;
    var iw=PW-2*m, ih=iw*pg.h/pg.w; if(ih>PH-2*m){ih=PH-2*m;iw=ih*pg.w/pg.h;}
    var cs='q '+iw.toFixed(2)+' 0 0 '+ih.toFixed(2)+' '+m+' '+(PH-m-ih).toFixed(2)+' cm /Im'+i+' Do Q';
    obj(pid,function(){put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im'+i+' '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>');});
    obj(cid,function(){put('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');});
    obj(iid,function(){put('<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.jpg.length+' >>\nstream\n');put(pg.jpg);put('\nendstream');});
  });
  var n=3+np*3, xo=off, x='xref\n0 '+n+'\n0000000000 65535 f \n';
  for(var j=1;j<n;j++)x+=('0000000000'+xref[j]).slice(-10)+' 00000 n \n';
  put(x+'trailer\n<< /Size '+n+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
var pdfBusy=false;
function makePDFBlob(){
  return Promise.resolve(document.fonts&&document.fonts.ready).then(function(){
    var r=drawReport(), pagePx=Math.floor(r.W*(595.28-44)/(841.89-44)), pages=[], y=0;
    while(y<r.H){
      var h=Math.min(pagePx,r.H-y), part=document.createElement('canvas'); part.width=r.W*r.k; part.height=h*r.k;
      var g=part.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,part.width,part.height);
      g.drawImage(r.cv,0,y*r.k,r.W*r.k,h*r.k,0,0,r.W*r.k,h*r.k);
      pages.push({jpg:b64bytes(part.toDataURL('image/jpeg',0.92).split(',')[1]),w:part.width,h:part.height}); y+=h;
    }
    return buildPDF(pages);
  });
}
function makePDF(share){
  if(pdfBusy)return; pdfBusy=true; toast('PDF 만드는 중…');
  var name=(S.info.title||'대회')+'_정산표.pdf';
  makePDFBlob().then(function(blob){
    if(share){
      var file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        return navigator.share({files:[file],title:(S.info.title||'')+' 정산표'}).then(function(){toast('공유했어요');},function(e){ if(!e||e.name!=='AbortError') download(name,blob,'application/pdf'); });
      }
    }
    download(name,blob,'application/pdf');
  }).catch(function(){ toast('PDF를 만들지 못했어요. 다시 시도해 주세요'); }).then(function(){pdfBusy=false;});
}
