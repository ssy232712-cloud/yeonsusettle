<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대회 예산·정산 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style id="css">
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --sub:#5f6b7a; --line:#e2e7ee;
  --pri:#1f6fd1; --pri-soft:#e8f1fd; --red:#d93838; --green:#1d8a4a; --yellow:#fff3b0;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.num,input.n{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px 0}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title-row h1{font-size:18px;margin:0;font-weight:800;flex:1;min-width:180px}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-weight:700}
.badge.warn{background:#fdecec;color:var(--red)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;padding:10px 12px;font:inherit;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:500;color:var(--sub);font-size:12.5px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--sub);font-weight:500}
input,select{font:inherit;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
input.n{text-align:right}
button.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;color:var(--ink);white-space:nowrap}
button.btn:hover{background:#f7f9fc}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:#1a5fb4}
button:disabled{opacity:.45;cursor:default}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
button.ghost{border-color:transparent;background:none;color:var(--sub)}
button.x{border:0;background:none;color:#a0a9b5;font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}
button.x:hover{color:var(--red)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--sub);font-size:13px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);gap:10px}
.kv:last-child{border-bottom:0}
.kv b{font-size:16px}
.kv.big b{font-size:20px}
.pos{color:var(--green)} .neg{color:var(--red)} .blue{color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat span{display:block;font-size:12px;color:var(--sub)}
.stat b{font-size:19px;font-weight:800}
.stat.hl{background:#eaf7ef;border-color:#c6e8d3}
.stat.hl b{color:var(--green)}
/* budget rows */
.brow{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fbfcfe}
.brow .top{display:flex;gap:8px;align-items:center}
.brow .top .no{font-weight:800;color:var(--sub);width:22px;text-align:center}
.brow .nums{display:grid;grid-template-columns:1.2fr .7fr .7fr 1.3fr;gap:8px}
.brow .nums label{font-size:11.5px}
@media (max-width:520px){.brow .nums{grid-template-columns:1fr 1fr 1fr}.brow .nums .amt{grid-column:1/-1}}
/* usage */
.ucard{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
.uhead{padding:12px 14px;background:#fbfcfe;border-bottom:1px solid var(--line)}
.uhead .t{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.bar{height:7px;border-radius:9px;background:#e9edf3;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.bar i.over{background:var(--red)}
.uhead .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}
.ubody{padding:8px 14px 12px}
.erow{display:grid;grid-template-columns:28px 1.1fr 1.4fr auto auto;gap:6px;align-items:center;padding:4px 0}
.erow .lt{font-weight:800;color:var(--sub);text-align:center;font-size:13px}
@media (max-width:520px){.erow{grid-template-columns:24px 1fr auto auto}.erow .memo{grid-column:2/-1;order:5}}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--sub);white-space:nowrap}
.chip.card{background:var(--pri-soft);border-color:#bcd6f7;color:var(--pri)}
.erow.card input.amt{color:var(--pri);font-weight:700}
/* deposit / extras */
.drow{display:grid;grid-template-columns:1.6fr 1fr .6fr auto;gap:6px;align-items:center;margin-bottom:6px}
.xrow{display:grid;grid-template-columns:1.6fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.grow{display:grid;grid-template-columns:1.4fr .8fr auto;gap:6px;align-items:center;margin-bottom:6px}
.hdr{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:4px}
.yellow{background:var(--yellow);border-color:#f1dc6b}
.warnbox{background:#fff6e5;border:1px solid #f5d79a;color:#8a5a00;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:8px}
.okbox{background:#eaf7ef;border:1px solid #c6e8d3;color:#17663a;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:8px}
/* report */
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;overflow-x:auto}
.sheet h3{font-size:22px;margin:0 0 14px;font-weight:800}
.sheet ul.info{list-style:none;padding:0;margin:0 0 18px;line-height:1.9}
.sheet ul.info li::before{content:"• ";font-weight:800}
table.rep{border-collapse:collapse;font-size:13.5px;min-width:900px;width:100%}
table.rep th,table.rep td{border:1px solid #cfd6df;padding:6px 8px;white-space:nowrap}
table.rep th{background:#f3f6fa;font-weight:700;text-align:center}
table.rep td.r{text-align:right}
table.rep td.c{text-align:center}
table.rep td.sep,table.rep th.sep{border-top:0;border-bottom:0;background:#fff;width:12px;padding:0}
table.rep tr.tot td{font-weight:800;background:#fafbfd}
.repfoot{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;min-width:900px}
.repfoot .kv{padding:6px 0}
.repfoot .bank{background:var(--yellow);border-radius:10px;padding:12px 16px}
.repfoot .bank .kv{border-bottom-color:#e6d27a}
.legend{font-size:12.5px;color:var(--sub);margin-top:6px}
/* toast / modal */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,35,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}
.modal h3{margin:0 0 8px}
.modal p{color:var(--sub);margin:0 0 16px;line-height:1.6;font-size:14px}
.modal .act{display:flex;gap:8px;justify-content:flex-end}
textarea.copy{width:100%;height:220px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:10px}
.banner{background:var(--pri-soft);border:1px solid #bcd6f7;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.savebar .in{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center}
.savebar .st{flex:1;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="state">null</script>
<script id="app">
(function(){
"use strict";
var CSS = document.getElementById('css').textContent;
var APP = document.getElementById('app').textContent;
var LS_KEY = 'settle-app-draft-v1';

/* ---------- 예시 데이터 (2026 경주화랑대기) ---------- */
function sample(){
  function E(a,c){return {amt:a,card:!!c,memo:''};}
  return {
    rev:0,
    info:{title:'2026년 경주화랑대기',place:'경주시민운동장, 축구공원, 알천구장, 에어돔',start:'2026-08-27',end:'2026-09-03',
      grades:[{label:'6학년',count:12},{label:'5학년',count:8},{label:'4학년',count:6},{label:'3학년',count:1}],coaches:5},
    items:[
      {name:'선수단 식음료비 (물,음료,얼음)',unit:4000,people:31,days:8,manual:null,entries:[E(100000,1),E(13800,1),E(125000,1),E(10000),E(18700),E(13100),E(237530)]},
      {name:'선수단 간식비',unit:4000,people:31,days:8,manual:null,entries:[E(112000,1),E(422360),E(77220),E(32400)]},
      {name:'선수단 세탁비 (1일2회 예상)',unit:35000,people:1,days:7,manual:null,entries:[E(50000),E(50000),E(25000),E(15000),E(13000),E(20000)]},
      {name:'선수단 약품비 (비상약 구입 외)',unit:1000,people:31,days:8,manual:null,entries:[E(33000,1),E(26220)]},
      {name:'선수단 특식비 외 추가식사비',unit:40000,people:31,days:1,manual:null,entries:[E(64500,1),E(188000,1),E(38280,1),E(39000,1),E(49000,1),E(156000,1),E(84000)]},
      {name:'선수단 사우나',unit:10000,people:31,days:1,manual:null,entries:[E(216000,1)]},
      {name:'선수단 예비비 및 활동경비',unit:500000,people:1,days:1,manual:null,entries:[E(500000,1)]},
      {name:'유류비 및 기타비품',unit:1000,people:31,days:8,manual:null,entries:[E(90000,1),E(202000,1)]}
    ],
    transfer:{label:'금강 잔여금액 이관 (반환분 39,510 제외)',amount:987800},
    share:145000,
    deposits:[{label:'기본 분담금',amount:145000,count:25},{label:'추가 분담 (145,000+39,510)',amount:184510,count:2}],
    refundUnit:1,
    bank:{label:'금강정산 후 8/17 모임통장 잔액 (이관금액 포함)',start:4374694,endLabel:'9/9 모임통장 최종 잔액',
      extras:[{label:'화랑대기 별도 공용통장 사용금액',amount:-102760},{label:'체크카드 캐시백 / 이자',amount:4693}]},
    note:'※ 2026 연수구청 모임통장에서 확인하실 수 있습니다.'
  };
}
function blank(){
  return {rev:0,info:{title:'새 대회',place:'',start:'',end:'',grades:[{label:'선수',count:0}],coaches:0},
    items:[{name:'',unit:0,people:0,days:1,manual:null,entries:[]}],
    transfer:{label:'이전 대회 잔여금 이관',amount:0},share:0,deposits:[{label:'기본 분담금',amount:0,count:0}],refundUnit:1,
    bank:{label:'시작 통장 잔액',start:0,endLabel:'최종 통장 잔액',extras:[]},note:''};
}

/* ---------- state ---------- */
var published = null;
try{ published = JSON.parse(document.getElementById('state').textContent); }catch(e){}
var LS_SAVED='settle-app-saved-v1';
if(!published){ try{ var sv=JSON.parse(localStorage.getItem(LS_SAVED)||'null'); if(sv&&sv.info&&sv.items) published=sv; }catch(e){} }
var S = published ? clone(published) : sample();
var dirty = false, restoredDraft = false;
try{
  var d = JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(d && d.state && d.baseRev === (published?published.rev:-1) && JSON.stringify(d.state)!==JSON.stringify(S)){
    S = d.state; dirty = true; restoredDraft = true;
  }
}catch(e){}
var tab = (location.hash||'').replace('#','') || 'info';
var TABS=[['info','기본정보'],['budget','예산'],['usage','사용내역'],['settle','정산'],['report','정산표']];
if(!TABS.some(function(t){return t[0]===tab;})) tab='info';
var artifactApi=null, downloadsApi=null;

function clone(o){return JSON.parse(JSON.stringify(o));}
function num(v){ if(v===null||v===undefined||v==='')return 0; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; }
function fmt(n){ n=Math.round(n*10)/10; var neg=n<0; n=Math.abs(n); var p=String(n).split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return (neg?'-':'')+p.join('.'); }
function won(n){return fmt(n)+'원';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function letter(i){var s='';i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

/* ---------- calc ---------- */
function calc(){
  var c={};
  c.players=S.info.grades.reduce(function(a,g){return a+num(g.count);},0);
  c.total=c.players+num(S.info.coaches);
  c.items=S.items.map(function(it){
    var auto=num(it.unit)*num(it.people)*num(it.days);
    var budget=(it.manual===null||it.manual===''||it.manual===undefined)?auto:num(it.manual);
    var used=it.entries.reduce(function(a,e){return a+num(e.amt);},0);
    var card=it.entries.reduce(function(a,e){return a+(e.card?num(e.amt):0);},0);
    return {auto:auto,budget:budget,used:used,card:card,diff:budget-used};
  });
  c.itemsBudget=c.items.reduce(function(a,x){return a+x.budget;},0);
  c.transfer=num(S.transfer.amount);
  c.budget=c.itemsBudget-c.transfer;
  c.used=c.items.reduce(function(a,x){return a+x.used;},0);
  c.cardUsed=c.items.reduce(function(a,x){return a+x.card;},0);
  c.perCalc=c.players?c.budget/c.players:0;
  c.perSuggest=Math.ceil(c.perCalc/5000)*5000;
  c.deposit=S.deposits.reduce(function(a,d){return a+num(d.amount)*num(d.count);},0);
  c.depCount=S.deposits.reduce(function(a,d){return a+num(d.count);},0);
  c.avail=c.deposit+c.transfer;
  c.remain=c.avail-c.used;
  c.perRefund=c.players?c.remain/c.players:0;
  var u=num(S.refundUnit)||1;
  c.refundEach=c.perRefund>=0?Math.floor(c.perRefund/u)*u:0;
  c.refundTotal=c.refundEach*c.players;
  c.leftover=c.remain-c.refundTotal;
  c.extras=S.bank.extras.reduce(function(a,x){return a+num(x.amount);},0);
  c.bankEnd=num(S.bank.start)+c.deposit-c.used+c.extras-c.refundTotal;
  c.maxEntries=S.items.reduce(function(a,it){return Math.max(a,it.entries.length);},0);
  var nd=period();
  c.period=nd;
  return c;
}
function period(){
  var a=S.info.start,b=S.info.end; if(!a||!b) return '';
  var d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00'); var n=Math.round((d2-d1)/864e5);
  if(!(n>=0)) return '';
  function k(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일';}
  return d1.getFullYear()+'년 '+k(d1)+' ~ '+k(d2)+' ('+n+'박'+(n+1)+'일)';
}

/* ---------- path helpers ---------- */
function getP(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k];},S);}
function setP(p,v){var ks=p.split('.'),o=S;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}
function inp(p,o){
  o=o||{}; var v=getP(p);
  if(o.n){ v=(v===null||v===undefined||v==='')?'':fmt(v); }
  return '<input data-p="'+p+'"'+(o.n?' data-n="1" class="n" inputmode="decimal"':'')+(o.null?' data-null="1"':'')+
    (o.type?' type="'+o.type+'"':'')+' value="'+esc(v)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.ph2?' data-ph="'+o.ph2+'"':'')+(o.aria?' aria-label="'+esc(o.aria)+'"':'')+'>';
}
function C(key,cls){return '<b class="num '+(cls||'')+'" data-c="'+key+'"></b>';}

/* ---------- render ---------- */
var root=document.getElementById('root');
function render(){
  var y=window.scrollY;
  var h='<header class="top"><div class="top-in"><div class="title-row"><h1>'+esc(S.info.title||'대회')+' 예산·정산</h1>'+
    '<span class="badge" data-c="hdrRemain"></span></div><nav class="tabs">'+
    TABS.map(function(t){return '<button data-a="tab" data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>';}).join('')+
    '</nav></div></header><main>';
  if(restoredDraft) h+='<div class="banner"><span>저장하지 않은 변경 내용을 이 기기에서 불러왔어요.</span><button class="btn sm" data-a="discardDraft">마지막 저장본으로 되돌리기</button></div>';
  h+=({info:vInfo,budget:vBudget,usage:vUsage,settle:vSettle,report:vReport}[tab])();
  h+='</main><div class="savebar"><div class="in"><span class="st" id="st"></span>'+
     '<button class="btn sm" data-a="menu">더보기</button><button class="btn sm" data-a="gsheet">구글시트</button><button class="btn pri sm" data-a="save">저장</button></div></div>';
  root.innerHTML=h;
  updateCalc(); updateStatus();
  window.scrollTo(0,y);
}

function vInfo(){
  var g=S.info.grades.map(function(x,i){
    return '<div class="grow">'+inp('info.grades.'+i+'.label',{aria:'구분'})+inp('info.grades.'+i+'.count',{n:1,aria:'인원'})+
      '<button class="x" data-a="del" data-l="info.grades" data-i="'+i+'" aria-label="삭제">×</button></div>';
  }).join('');
  return '<div class="card"><h2>대회 정보</h2><div class="grid g2">'+
    '<label class="f">대회명'+inp('info.title')+'</label>'+
    '<label class="f">장소'+inp('info.place')+'</label>'+
    '<label class="f">시작일'+inp('info.start',{type:'date'})+'</label>'+
    '<label class="f">종료일'+inp('info.end',{type:'date'})+'</label></div>'+
    '<p class="muted" style="margin:10px 0 0">기간: <b data-c="period" class="blue"></b></p></div>'+
    '<div class="card"><h2>참가 인원 <small>선수 학년별 + 지도진</small></h2>'+
    '<div class="grow hdr"><span>구분</span><span>인원</span><span></span></div>'+g+
    '<button class="btn sm" data-a="add" data-l="info.grades">+ 구분 추가</button>'+
    '<div class="grid g2" style="margin-top:12px"><label class="f">지도진 수'+inp('info.coaches',{n:1})+'</label></div>'+
    '<div style="margin-top:12px"><div class="kv"><span>선수</span>'+C('players')+'</div><div class="kv"><span>총 인원</span>'+C('total')+'</div></div>'+

/* ---------- live numbers ---------- */
function updateCalc(){
  var c=calc();
  var map={players:c.players+'명',total:c.total+'명',playersTxt:c.players+'명',period:c.period||'날짜를 입력하세요',
    itemsBudget:won(c.itemsBudget),transferNeg:'-'+won(c.transfer),transfer:won(c.transfer),budget:won(c.budget),
    perCalc:won(Math.round(c.perCalc*10)/10),perSuggest:won(c.perSuggest),used:won(c.used),usedNeg:'('+fmt(c.used)+')',
    cardUsed:won(c.cardUsed),rcptUsed:won(c.used-c.cardUsed),deposit:won(c.deposit),depCount:c.depCount,avail:won(c.avail),
    remain:won(c.remain),perRefund:fmt(c.perRefund)+'원',refundEach:won(c.refundEach),refundTotal:won(c.refundTotal),
    refundNeg:'('+fmt(c.refundTotal)+')',leftover:won(c.leftover),bankEnd:won(c.bankEnd),hdrRemain:'잔여 '+won(c.remain)};
  c.items.forEach(function(x,i){
    map['used'+i]=won(x.used); map['bud'+i]=won(x.budget);
    map['diff'+i]=x.diff>=0?'남음 '+won(x.diff):'초과 '+won(-x.diff);
  });
  root.querySelectorAll('[data-c]').forEach(function(el){
    var k=el.getAttribute('data-c');
    if(k==='depCheck'){
      el.innerHTML = c.depCount===c.players ? '<div class="okbox">입금 인원 '+c.depCount+'명 = 선수 '+c.players+'명 ✓</div>'
        : '<div class="warnbox">입금 인원('+c.depCount+'명)과 선수 수('+c.players+'명)가 달라요.</div>';
      return;
    }
    if(k in map) el.textContent=map[k];
    if(/^diff/.test(k)) el.className=c.items[+k.slice(4)].diff<0?'neg':'';
  });
  root.querySelectorAll('[data-bar]').forEach(function(el){
    var x=c.items[+el.getAttribute('data-bar')]; var p=x.budget>0?Math.min(100,x.used/x.budget*100):(x.used>0?100:0);
    el.style.width=p+'%'; el.className=x.used>x.budget?'over':'';
  });
  root.querySelectorAll('[data-ph]').forEach(function(el){
    var i=+el.getAttribute('data-ph').slice(4); el.placeholder=fmt(c.items[i].auto);
  });
}
function updateStatus(){
  var el=document.getElementById('st'); if(!el)return;
  el.textContent = dirty ? '저장 안 된 변경 있음 (이 기기에 임시 보관 중)' : (artifactApi?'모든 변경 저장됨':'이 기기(브라우저)에 저장됨');
  el.style.color = dirty ? '#b26b00' : '';
}

/* ---------- events ---------- */
var draftT=null;
function touch(){
  dirty=true; updateStatus();
  clearTimeout(draftT); draftT=setTimeout(function(){
    try{localStorage.setItem(LS_KEY,JSON.stringify({baseRev:published?published.rev:-1,state:S}));}catch(e){}
  },400);
}
root.addEventListener('input',function(e){
  var t=e.target, p=t.getAttribute('data-p'); if(!p)return;
  var v=t.value;
  if(t.getAttribute('data-n')){ v=(t.getAttribute('data-null')&&v.trim()==='')?null:num(v); }
  setP(p,v); touch(); updateCalc();
  if(p==='info.title'){ var h=root.querySelector('header h1'); if(h) h.textContent=(S.info.title||'대회')+' 예산·정산'; }
});
root.addEventListener('change',function(e){
  var t=e.target; if(t.getAttribute('data-n') && t.tagName==='INPUT'){ var v=getP(t.getAttribute('data-p')); t.value=(v===null||v==='')?'':fmt(v); }
  if(t.tagName==='SELECT'){ setP(t.getAttribute('data-p'),num(t.value)); touch(); updateCalc(); }
});
root.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b)return;
  var a=b.getAttribute('data-a'), i=+b.getAttribute('data-i'), l=b.getAttribute('data-l');
  var c=calc();
  switch(a){
    case 'tab': tab=b.getAttribute('data-t'); try{history.replaceState(null,'','#'+tab);}catch(_){location.hash=tab;} render(); window.scrollTo(0,0); return;
    case 'add':
      var arr=getP(l);
      if(l==='info.grades') arr.push({label:'',count:0});
      else if(l==='deposits') arr.push({label:'',amount:num(S.share),count:0});
      else if(l==='bank.extras') arr.push({label:'',amount:0});
      break;
    case 'del': getP(l).splice(i,1); break;
    case 'addItem': S.items.push({name:'',unit:0,people:c.total||0,days:1,manual:null,entries:[]}); break;
    case 'addEntry': S.items[i].entries.push({amt:0,card:false,memo:''}); touch(); render();
      var ins=root.querySelectorAll('[data-p="items.'+i+'.entries.'+(S.items[i].entries.length-1)+'.amt"]'); if(ins[0]){ins[0].value='';ins[0].focus();} return;
    case 'card': var en=S.items[i].entries[+b.getAttribute('data-j')]; en.card=!en.card; break;
    case 'applySuggest': S.share=c.perSuggest; break;
    case 'shareToDeposit': if(S.deposits.length) S.deposits[0].amount=num(S.share); else S.deposits.push({label:'기본 분담금',amount:num(S.share),count:c.players}); toast('첫 번째 입금 줄에 반영했어요'); break;
    case 'save': save(); return;
    case 'menu': menu(); return;
    case 'notice': showCopy('공지 문구',noticeText()); return;
    case 'csv': csv(); return;
    case 'gsheet': gsheetModal(); return;
    case 'discardDraft': S=published?clone(published):sample(); dirty=false; restoredDraft=false; try{localStorage.removeItem(LS_KEY);}catch(_){ } render(); return;
    default: return;
  }
  touch(); render();
});

function buildDoc(state){

function normDate(s){ var m=String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if(!m)return ''; return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2); }

function parseCSVText(t){
  var rows=[],row=[],cur='',q=false; t=String(t).replace(/^\ufeff/,'');
  for(var i=0;i<t.length;i++){ var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; row.push(cur);rows.push(row);row=[];cur=''; }
    else cur+=ch; }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.map(function(r){return r.map(function(x){return x.trim();});});
}
function mdRows(text){
  var rows=[];
  String(text).split('\n').forEach(function(line){
    line=line.trim(); if(line.charAt(0)!=='|')return;
    var cells=line.split(/(?<!\\)\|/).slice(1,-1).map(function(x){return x.trim().replace(/\\([\\`*_{}\[\]()#+\-.!|"<>~])/g,'$1');});
    if(cells.every(function(x){return /^:?-*:?$/.test(x);}))return;
    rows.push(cells);
  });
  return rows;
}
function parseRows(rows){
  var st={rev:S.rev,info:{title:'',place:'',start:'',end:'',grades:[],coaches:0},items:[],transfer:{label:'이전 대회 잔여금 이관',amount:0},
    share:0,deposits:[],refundUnit:1,bank:{label:'시작 통장 잔액',start:0,endLabel:'최종 통장 잔액',extras:[]},note:'',gsheet:S.gsheet||null};
  var byNo={}, hits=0;
  function item(no,name){ if(!byNo[no]){ byNo[no]={name:name||('항목 '+no),unit:0,people:0,days:1,manual:null,entries:[]}; st.items.push(byNo[no]); } return byNo[no]; }
  rows.forEach(function(r){
    var k=(r[0]||'').replace(/\s/g,''), no=r[1]||'', txt=r[2]||'';
    switch(k){
      case '대회': hits++;
        if(no==='대회명')st.info.title=txt; else if(no==='장소')st.info.place=txt;
        else if(no==='시작일')st.info.start=normDate(txt); else if(no==='종료일')st.info.end=normDate(txt);
        else if(no==='지도진')st.info.coaches=num(r[3]); else if(no==='메모')st.note=txt; break;
      case '인원': hits++; st.info.grades.push({label:txt,count:num(r[3])}); break;
      case '예산': hits++; var it=item(no||String(st.items.length+1),txt); it.name=txt||it.name; it.unit=num(r[3]); it.people=num(r[4]); it.days=num(r[5]);
        it.manual=(r[8]||'')===''?null:num(r[8]); break;
      case '사용': hits++; if(!num(r[3])&&!(r[7]||''))break;
        item(no||'기타',txt).entries.push({amt:num(r[3]),card:/카드|이체/.test(r[6]||''),memo:r[7]||''}); break;
      case '이관': hits++; st.transfer={label:txt,amount:num(r[3])}; break;
      case '분담금': hits++; st.share=num(r[3]); break;
      case '입금': hits++; st.deposits.push({label:txt,amount:num(r[3]),count:num(r[4])}); break;
      case '반환단위': hits++; st.refundUnit=num(r[3])||1; break;
      case '통장시작': hits++; st.bank.label=txt; st.bank.start=num(r[3]); break;
      case '통장기타': hits++; st.bank.extras.push({label:txt,amount:num(r[3])}); break;

    }
  });

}

  var last=S.gsheet;
  var m=modal('<h3>구글시트 연동</h3>'+
    (mcpApi?'':'<div class="warnbox" style="margin-bottom:10px">구글 드라이브 바로 연결은 Claude 앱에서 열었을 때만 돼요. 여기서는 CSV 파일로 주고받아요:<br>① <b>시트용 CSV 받기</b> → 구글시트에서 파일 › 가져오기<br>② 구글시트에서 파일 › 다운로드 › CSV → <b>시트 CSV 불러오기</b></div>')+
    '<p>· <b>내보내기</b>: 지금 내용을 내 구글 드라이브에 <b>새 시트</b>로 만들어요 (누를 때마다 새 파일).<br>· <b>불러오기</b>: 시트에서 고치거나 "사용" 줄을 추가한 뒤 불러오면 앱에 반영돼요.</p>'+
    (last&&last.url?'<div class="okbox" style="margin-bottom:12px">최근 내보낸 시트: <a href="'+esc(last.url)+'" target="_blank" rel="noopener">'+esc(last.title)+'</a><br><small>'+esc(last.at||'')+'</small></div>':'')+
    '<div id="gmsg"></div><div class="grid">'+
    '<button class="btn pri" data-g="export"'+(mcpApi?'':' disabled')+'>구글시트로 내보내기</button>'+
    '<button class="btn" data-g="list"'+(mcpApi?'':' disabled')+'>구글시트에서 불러오기</button>'+
    '<button class="btn" data-g="csv">시트용 CSV 파일 받기</button>'+
    '<label class="btn" style="text-align:center;cursor:pointer">시트 CSV 불러오기<input type="file" accept=".csv,text/csv" hidden data-gcsv></label>'+
    '<div id="glist"></div><button class="btn ghost" data-close>닫기</button></div>');
  var msg=m.querySelector('#gmsg'), list=m.querySelector('#glist'), busy=false;
  m.querySelector('[data-gcsv]').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f)return; var r=new FileReader();
    r.onload=function(){ var st; try{ st=parseRows(parseCSVText(r.result)); }catch(_){ say('이 파일에서 정산 데이터를 찾지 못했어요. 앱에서 받은 시트 형식(구분 칸)을 유지해 주세요.'); return; }
      m.remove(); confirmBox('"'+f.name+'" 내용으로 바꿀까요?','예산 항목 '+st.items.length+'개. 지금 앱 내용은 이 파일 내용으로 바뀌어요 (저장 전까지는 되돌릴 수 있어요).',function(){ S=st; touch(); render(); toast('불러왔어요. 저장을 눌러 확정하세요'); }); };
    r.readAsText(f,'utf-8');
  });
  function say(t,ok){ msg.innerHTML=t?'<div class="'+(ok?'okbox':'warnbox')+'" style="margin:0 0 10px">'+t+'</div>':''; }
  m.addEventListener('click',function(e){
    var b=e.target.closest('[data-g]'); if(!b||busy)return; var k=b.getAttribute('data-g');
    if(k==='csv'){ download((S.info.title||'정산')+'_시트용.csv','﻿'+rowsToCSV(sheetRows()),'text/csv'); return; }
    if(!mcpApi) return;
    busy=true; b.disabled=true;
    function done(){busy=false;b.disabled=false;}
    if(k==='export'){
      say('구글 드라이브에 시트를 만드는 중…',true);
      var title=SHEET_PREFIX+' '+(S.info.title||'대회')+' ('+stamp()+')';
      mcpApi.callTool(GD,'create_file',{title:title,textContent:rowsToCSV(sheetRows()),contentMimeType:'text/csv'}).then(function(res){
        var p=res.payload||{}; var url=p.viewUrl||(p.id?'https://docs.google.com/spreadsheets/d/'+p.id+'/edit':'');
        S.gsheet={id:p.id||'',url:url,title:p.title||title,at:stamp()}; touch();
        say('만들었어요! <a href="'+esc(url)+'" target="_blank" rel="noopener">시트 열기</a> · 앱의 "저장"을 누르면 시트 링크도 함께 저장돼요.',true);
        done();
      },function(err){ say(esc(gErr(err))); done(); });
    }
    if(k==='list'){
      say('시트 목록을 찾는 중…',true);
      mcpApi.callTool(GD,'search_files',{query:"title contains '"+SHEET_PREFIX+"' and mimeType = 'application/vnd.google-apps.spreadsheet'",excludeContentSnippets:true,pageSize:20},{cache:false}).then(function(res){
        var fs=((res.payload||{}).files||[]).slice().sort(function(a,b){return String(b.modifiedTime).localeCompare(String(a.modifiedTime));});
        say(fs.length?'불러올 시트를 고르세요 (최근 수정순)':'제목이 "'+SHEET_PREFIX+'"로 시작하는 시트가 없어요. 먼저 내보내기를 해 주세요.',!!fs.length);
        list.innerHTML=fs.map(function(f){
          return '<button class="btn" style="text-align:left;white-space:normal;width:100%;margin-bottom:6px" data-g="pick" data-id="'+esc(f.id)+'">'+esc(f.title)+
            '<br><small class="muted">수정 '+esc(String(f.modifiedTime||'').replace('T',' ').slice(0,16))+' (UTC)</small></button>';
        }).join('');
        done();
      },function(err){ say(esc(gErr(err))); done(); });
    }
    if(k==='pick'){
      var id=b.getAttribute('data-id'); say('시트를 읽는 중…',true);
      mcpApi.callTool(GD,'read_file_content',{fileId:id},{cache:false}).then(function(res){
        var p=res.payload||{}, text=typeof p==='string'?p:(p.fileContent||'');
        var st; try{ st=parseSheet(text); }catch(_){ say('이 시트에서 정산 데이터를 찾지 못했어요. 앱에서 내보낸 형식(구분 칸)을 유지해 주세요.'); done(); return; }
        done(); m.remove();
        var used=st.items.reduce(function(a,it){return a+it.entries.reduce(function(x,e){return x+num(e.amt);},0);},0);
        confirmBox('"'+(p.title||'시트')+'" 내용으로 바꿀까요?','예산 항목 '+st.items.length+'개, 사용 '+fmt(used)+'원. 지금 앱 내용은 이 시트 내용으로 바뀌어요 (저장 전까지는 되돌릴 수 있어요).',function(){
          st.gsheet={id:id,url:p.viewUrl||'',title:p.title||'',at:stamp()}; S=st; touch(); render(); toast('시트에서 불러왔어요. 저장을 눌러 확정하세요');
        });
      },function(err){ say(esc(gErr(err))); done(); });
    }
  });
}

var toastEl=null,toastT=null;
function toast(m){ if(!toastEl){toastEl=document.createElement('div');toastEl.className='toast';document.body.appendChild(toastEl);} toastEl.textContent=m; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('on');},2600); }

window.addEventListener('hashchange',function(){var t=location.hash.replace('#','');if(TABS.some(function(x){return x[0]===t;})&&t!==tab){tab=t;render();}});
window.addEventListener('beforeunload',function(){ try{ if(dirty) localStorage.setItem(LS_KEY,JSON.stringify({baseRev:published?published.rev:-1,state:S})); }catch(e){} });

render();
if(window.claude && typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(a){artifactApi=a;updateStatus();},function(){});
  window.claude.use('downloads').then(function(d){downloadsApi=d;},function(){});
  window.claude.use('mcp').then(function(m){mcpApi=m;},function(){});
}
})();
</script>
</body>
</html>
